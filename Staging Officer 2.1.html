<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staging Officer Tactical Board</title>
    
    <meta name="theme-color" content="#1f2937"/>
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* gray-900 */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .drop-zone {
            transition: all 0.2s ease;
            min-height: 200px;
        }
        .drop-zone.drag-over {
            border-color: #3b82f6;
            background-color: #1f2937;
        }
        .unit-card {
            cursor: grab;
            transition: all 0.2s;
        }
        .unit-card:active {
            cursor: grabbing;
        }
        .unit-card.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        /* --- MOBILE SIMULATION MODE CSS --- */
        /* These styles force the layout to look like a phone even on a desktop screen */
        body.sim-mobile {
            max-width: 480px !important;
            margin: 0 auto;
            border-left: 1px solid #374151;
            border-right: 1px solid #374151;
            padding: 10px !important;
        }
        
        /* Force Header Inputs to 2 columns in sim mode */
        body.sim-mobile .md\:grid-cols-4, 
        body.sim-mobile .lg\:grid-cols-6 {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }

        /* Force Board to stack (1 column) in sim mode */
        body.sim-mobile .md\:grid-cols-2 {
            grid-template-columns: 1fr !important;
        }

        /* Force Form to stack vertical in sim mode */
        body.sim-mobile .md\:flex-row {
            flex-direction: column !important;
        }
        body.sim-mobile .md\:w-auto, 
        body.sim-mobile .md\:w-48, 
        body.sim-mobile .md\:w-24 {
            width: 100% !important;
        }

        /* --- PRINT STYLES --- */
        #print-report-container { display: none; }

        @media print {
            body { background-color: white; color: black; max-width: 100% !important; border: none !important; }
            header, section, main, .no-print { display: none !important; }
            #print-report-container { 
                display: block !important; 
                position: absolute; top: 0; left: 0; width: 100%; 
                background: white; padding: 20px;
            }
            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            th, td { border: 1px solid #000; padding: 8px; text-align: left; }
            th { background-color: #f3f4f6; font-weight: bold; }
            .print-header { margin-bottom: 20px; border-bottom: 2px solid black; padding-bottom: 10px; }
            .status-badge { font-weight: bold; text-transform: uppercase; font-size: 0.8em; }
        }
    </style>
</head>
<body id="app-body" class="text-gray-100 h-full flex flex-col p-4 md:p-6 max-w-7xl mx-auto w-full transition-all duration-300">

    <header class="mb-4 flex flex-col gap-4">
        <div class="flex items-center justify-between gap-2">
            <a href="index.html" class="inline-flex items-center gap-2 px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg border border-gray-700 transition-colors text-xs md:text-sm font-medium whitespace-nowrap">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Menu
            </a>
            
            <h1 class="text-xl md:text-3xl font-bold text-white text-center flex-1 truncate">Staging Board</h1>

            <div class="flex items-center gap-2">
                <button onclick="toggleView()" id="btn-toggle-view" class="inline-flex items-center gap-2 px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg border border-gray-600 shadow-lg transition-colors text-xs md:text-sm font-bold" title="Toggle Mobile/Desktop View">
                    <i data-lucide="smartphone" class="w-4 h-4"></i>
                    <span class="hidden md:inline">Mobile View</span>
                </button>

                <button onclick="printReport()" class="inline-flex items-center gap-2 px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow-lg transition-colors text-xs md:text-sm font-bold">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    <span class="hidden md:inline">Print</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg transition-all">
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase">Address</label>
                <input type="text" id="meta-address" class="w-full bg-transparent text-white font-bold border-b border-gray-600 focus:border-blue-500 outline-none py-1" placeholder="123 Main St">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase">Incident #</label>
                <input type="text" id="meta-incident" class="w-full bg-transparent text-white font-bold border-b border-gray-600 focus:border-blue-500 outline-none py-1" placeholder="2025-001">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase">Staging Officer</label>
                <input type="text" id="meta-officer" class="w-full bg-transparent text-white font-bold border-b border-gray-600 focus:border-blue-500 outline-none py-1" placeholder="Capt. Name">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase">Staging Location</label>
                <input type="text" class="w-full bg-transparent text-white font-bold border-b border-gray-600 focus:border-blue-500 outline-none py-1" placeholder="Primary Location">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase">Tactical Channel</label>
                <input type="text" class="w-full bg-transparent text-blue-400 font-bold border-b border-gray-600 focus:border-blue-500 outline-none py-1" value="TAC 3">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase">Staging Channel</label>
                <input type="text" class="w-full bg-transparent text-blue-400 font-bold border-b border-gray-600 focus:border-blue-500 outline-none py-1" value="TAC 4">
            </div>
        </div>
    </header>

    <section class="mb-6">
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-xl transition-all">
            <form id="add-unit-form" class="flex flex-col md:flex-row items-end gap-4" onsubmit="handleUnitSubmit(event)">
                
                <div class="flex-1 w-full md:w-auto">
                    <label class="block text-xs font-medium text-gray-400 mb-1 uppercase">Unit ID</label>
                    <input type="text" id="entry-id" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white font-bold focus:border-blue-500 outline-none uppercase" placeholder="E1, T4..." required>
                </div>

                <div class="w-full md:w-48">
                    <label class="block text-xs font-medium text-gray-400 mb-1 uppercase">Type</label>
                    <select id="entry-type" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:border-blue-500 outline-none">
                        <option value="Engine">Engine</option>
                        <option value="Truck">Truck</option>
                        <option value="Rescue">Rescue</option>
                        <option value="Squad">Squad</option>
                        <option value="Chief">Chief / Officer</option>
                        <option value="Brush">Brush</option>
                        <option value="Hazmat">Hazmat</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="w-full md:w-24">
                    <label class="block text-xs font-medium text-gray-400 mb-1 uppercase">Pers.</label>
                    <input type="number" id="entry-personnel" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:border-blue-500 outline-none text-center" value="3" min="1">
                </div>

                <div class="w-full md:w-auto">
                    <button type="submit" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-lg shadow-lg transition-transform active:scale-95 flex justify-center items-center gap-2 whitespace-nowrap">
                        <i data-lucide="plus" class="w-5 h-5"></i> Add
                    </button>
                </div>
            </form>
        </div>
    </section>

    <main id="view-board" class="flex-1 flex flex-col gap-6">
        
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-blue-900/20 border border-blue-500/50 p-4 rounded-xl flex items-center justify-between">
                <div>
                    <h3 class="text-blue-400 text-sm font-bold uppercase">In Staging</h3>
                    <div class="text-xs text-gray-400">Available Resources</div>
                </div>
                <div class="text-right">
                    <div id="count-staging-units" class="text-3xl font-bold text-white leading-none">0</div>
                    <div class="text-[10px] text-gray-400 uppercase">Units</div>
                </div>
            </div>
            
            <div class="bg-red-900/20 border border-red-500/50 p-4 rounded-xl flex items-center justify-between">
                <div>
                    <h3 class="text-red-400 text-sm font-bold uppercase">Deployed / Assigned</h3>
                    <div class="text-xs text-gray-400">Committed Resources</div>
                </div>
                <div class="text-right">
                    <div id="count-deployed-units" class="text-3xl font-bold text-white leading-none">0</div>
                    <div class="text-[10px] text-gray-400 uppercase">Units</div>
                </div>
            </div>
        </div>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 min-h-[400px] transition-all">
            
            <div class="flex flex-col bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                <div class="p-3 bg-blue-900/30 border-b border-blue-500/30 flex justify-between items-center">
                    <h3 class="font-bold text-blue-100 flex items-center gap-2">
                        <i data-lucide="map-pin" class="w-4 h-4"></i> Staging Area
                    </h3>
                </div>
                <div id="zone-staging" class="drop-zone flex-1 p-3 space-y-2 bg-gray-800/50" ondragover="allowDrop(event)" ondrop="drop(event, 'staging')">
                    </div>
            </div>

            <div class="flex flex-col bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                <div class="p-3 bg-red-900/30 border-b border-red-500/30 flex justify-between items-center">
                    <h3 class="font-bold text-red-100 flex items-center gap-2">
                        <i data-lucide="arrow-right-circle" class="w-4 h-4"></i> Deployed / Assigned
                    </h3>
                </div>
                <div id="zone-deployed" class="drop-zone flex-1 p-3 space-y-2 bg-gray-800/50" ondragover="allowDrop(event)" ondrop="drop(event, 'deployed')">
                    </div>
            </div>

        </div>
    </main>

    <div id="print-report-container">
        <div class="print-header">
            <h1 style="font-size: 24px; font-weight: bold;">Staging Accountability Report</h1>
            <p><strong>Incident #:</strong> <span id="print-incident"></span></p>
            <p><strong>Address:</strong> <span id="print-address"></span></p>
            <p><strong>Staging Officer:</strong> <span id="print-officer"></span></p>
            <p><strong>Date/Time Printed:</strong> <span id="print-date"></span></p>
        </div>
        
        <table id="report-table">
            <thead>
                <tr>
                    <th>Unit ID</th>
                    <th>Type</th>
                    <th>Personnel</th>
                    <th>Check-In Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="report-body">
                </tbody>
            <tfoot>
                <tr>
                    <td colspan="2" style="text-align: right; font-weight: bold;">TOTALS:</td>
                    <td style="font-weight: bold;" id="print-total-personnel">0</td>
                    <td colspan="2"></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script>
        // --- GLOBAL STATE ---
        let units = [];
        let draggedUnitId = null;
        let isSimulatedMobile = false;

        // --- CORE FUNCTIONALITY ---
        
        function handleUnitSubmit(e) {
            e.preventDefault();
            const idInput = document.getElementById('entry-id');
            const typeInput = document.getElementById('entry-type');
            const personnelInput = document.getElementById('entry-personnel');

            const id = idInput.value ? idInput.value.trim().toUpperCase() : '';
            const type = typeInput.value;
            const personnel = parseInt(personnelInput.value) || 0;

            if (!id) return;

            const newUnit = {
                id: Date.now().toString(),
                name: id,
                type: type,
                personnel: personnel,
                status: 'staging',
                checkInTime: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            units.push(newUnit);
            
            idInput.value = '';
            personnelInput.value = '3';
            idInput.focus();
            renderBoard();
        }

        // --- Drag & Drop ---
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.addEventListener('dragleave', (e) => e.currentTarget.classList.remove('drag-over'));
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        function drag(ev, unitId) {
            draggedUnitId = unitId;
            ev.dataTransfer.setData("text", unitId);
            ev.target.classList.add('dragging');
        }

        function drop(ev, targetStatus) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            const unitId = ev.dataTransfer.getData("text");
            const unitIndex = units.findIndex(u => u.id === unitId);
            if (unitIndex > -1) {
                units[unitIndex].status = targetStatus;
                renderBoard();
            }
        }

        function deleteUnit(id) {
            if(confirm('Remove this unit from the board?')) {
                units = units.filter(u => u.id !== id);
                renderBoard();
            }
        }

        // --- View Toggle Logic ---
        function toggleView() {
            const body = document.getElementById('app-body');
            const btn = document.getElementById('btn-toggle-view');
            const btnSpan = btn.querySelector('span');
            const btnIcon = btn.querySelector('i'); // Lucide replaces <i> with <svg>

            isSimulatedMobile = !isSimulatedMobile;

            if (isSimulatedMobile) {
                body.classList.add('sim-mobile');
                btnSpan.textContent = "Desktop View";
                // Update icon to monitor (requires clearing current SVG and setting new attr or re-render)
                // Simplest way: re-render lucide
                btn.innerHTML = `<i data-lucide="monitor" class="w-4 h-4"></i> <span class="hidden md:inline">Desktop View</span>`;
            } else {
                body.classList.remove('sim-mobile');
                btnSpan.textContent = "Mobile View";
                btn.innerHTML = `<i data-lucide="smartphone" class="w-4 h-4"></i> <span class="hidden md:inline">Mobile View</span>`;
            }
            lucide.createIcons();
        }

        // --- Rendering ---
        function renderBoard() {
            const zoneStaging = document.getElementById('zone-staging');
            const zoneDeployed = document.getElementById('zone-deployed');
            
            zoneStaging.innerHTML = '';
            zoneDeployed.innerHTML = '';
            
            let stagingCount = 0;
            let deployedCount = 0;

            units.forEach(unit => {
                const card = createUnitCard(unit);
                if (unit.status === 'staging') {
                    zoneStaging.appendChild(card);
                    stagingCount++;
                } else {
                    zoneDeployed.appendChild(card);
                    deployedCount++;
                }
            });

            document.getElementById('count-staging-units').textContent = stagingCount;
            document.getElementById('count-deployed-units').textContent = deployedCount;

            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function createUnitCard(unit) {
            const div = document.createElement('div');
            div.className = "unit-card bg-gray-700 p-3 rounded-lg border border-gray-600 shadow-sm flex justify-between items-center group select-none";
            div.draggable = true;
            div.addEventListener('dragstart', (e) => drag(e, unit.id));
            div.addEventListener('dragend', (e) => e.target.classList.remove('dragging'));

            let iconColor = "text-gray-400";
            if(unit.type === 'Engine') iconColor = "text-red-400";
            if(unit.type === 'Truck') iconColor = "text-blue-400";
            if(unit.type === 'Rescue') iconColor = "text-green-400";
            if(unit.type === 'Chief') iconColor = "text-white";

            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="font-bold text-lg text-white ${iconColor}">${unit.name}</div>
                    <div class="text-xs text-gray-400 flex flex-col">
                        <span>${unit.type} (${unit.personnel})</span>
                        <span class="text-[10px] opacity-75">In: ${unit.checkInTime}</span>
                    </div>
                </div>
                <button onclick="deleteUnit('${unit.id}')" class="text-gray-500 hover:text-red-400 p-2 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            `;
            return div;
        }

        // --- Print Logic ---
        function printReport() {
            document.getElementById('print-incident').textContent = document.getElementById('meta-incident').value || 'N/A';
            document.getElementById('print-address').textContent = document.getElementById('meta-address').value || 'N/A';
            document.getElementById('print-officer').textContent = document.getElementById('meta-officer').value || 'N/A';
            document.getElementById('print-date').textContent = new Date().toLocaleString();

            const tbody = document.getElementById('report-body');
            tbody.innerHTML = '';
            
            let totalPersonnel = 0;
            const sortedUnits = [...units].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

            sortedUnits.forEach(unit => {
                const tr = document.createElement('tr');
                const statusText = unit.status === 'staging' ? 'IN STAGING' : 'DEPLOYED';
                
                tr.innerHTML = `
                    <td><strong>${unit.name}</strong></td>
                    <td>${unit.type}</td>
                    <td>${unit.personnel}</td>
                    <td>${unit.checkInTime}</td>
                    <td><span class="status-badge">${statusText}</span></td>
                `;
                tbody.appendChild(tr);
                totalPersonnel += parseInt(unit.personnel) || 0;
            });

            document.getElementById('print-total-personnel').textContent = totalPersonnel;
            window.print();
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Error:', err));
            });
        }
    </script>
</body>
</html>
